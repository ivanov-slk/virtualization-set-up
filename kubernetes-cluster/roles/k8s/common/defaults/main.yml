k8s_common_add_packages_keys:
  - key: https://download.docker.com/linux/ubuntu/gpg
  - key: https://packages.cloud.google.com/apt/doc/apt-key.gpg
  - key: https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key

k8s_common_add_packages_repositories:
  - repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ansible_distribution_release}} stable"
  - repo: "deb [arch=amd64] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /"

k8s_common_add_packages_names:
  - name: apt-transport-https
  - name: curl
  - name: containerd.io
  - name: kubeadm
  - name: kubelet
  - name: kubectl
  - name: python3-pip

k8s_common_remove_packages_names:
  - name:

k8s_common_modprobe:
  - name: overlay
  - name: br_netfilter

k8s_common_sysctl:
  - name: net.bridge.bridge-nf-call-iptables
    value: 1
  - name: net.ipv4.ip_forward
    value: 1
  - name: net.bridge.bridge-nf-call-ip6tables
    value: 1

k8s_common_admin_user: "vagrant"
k8s_common_admin_group: "sudo"
